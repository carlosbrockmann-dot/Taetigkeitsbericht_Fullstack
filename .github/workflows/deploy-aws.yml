name: Deploy AWS (main)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_instance_refresh:
        description: "EC2-Instanzen per CloudFormation ersetzen"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Secret bevorzugen; Variable als Fallback (falls unter Variables statt Secrets angelegt)
  AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
  STACK_NAME: taetigkeitsbericht
  PROJECT_NAME: taetigkeitsbericht

jobs:
  deploy-infra:
    name: CloudFormation VPC + EC2 + DSQL
    runs-on: ubuntu-latest
    outputs:
      backend_instance_id: ${{ steps.outs.outputs.backend_instance_id }}
      frontend_instance_id: ${{ steps.outs.outputs.frontend_instance_id }}
      backend_public_ip: ${{ steps.outs.outputs.backend_public_ip }}
      frontend_public_ip: ${{ steps.outs.outputs.frontend_public_ip }}
      # dsql_endpoint bewusst kein Job-Output: GitHub filtert Hostnamen oft als Secret heraus
      ec2_role_arn: ${{ steps.outs.outputs.ec2_role_arn }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${AWS_REGION:-}" ]; then
            echo "::error::AWS_REGION fehlt. Unter Settings → Secrets and variables → Actions ein Secret (oder Variable) 'AWS_REGION' anlegen, z. B. eu-central-1"
            missing=1
          fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::error::Secret AWS_ACCESS_KEY_ID fehlt."
            missing=1
          fi
          if [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Secret AWS_SECRET_ACCESS_KEY fehlt."
            missing=1
          fi
          if [ -z "${JWT_KEY:-}" ]; then
            echo "::error::Secret JWT_KEY fehlt (wird später fürs Backend-Deploy gebraucht)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "AWS_REGION=$AWS_REGION"

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy / update CloudFormation stack
        id: cfn
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_instance_refresh || 'false' }}
        run: |
          set -euo pipefail
          PARAMS=(
            "ProjectName=${PROJECT_NAME}"
            "ForceInstanceRefresh=${FORCE_REFRESH}"
          )
          if [ -n "${{ secrets.EC2_KEY_NAME }}" ]; then
            PARAMS+=("KeyName=${{ secrets.EC2_KEY_NAME }}")
          fi

          echo "Region=${AWS_REGION} Stack=${STACK_NAME}"
          aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query "Stacks[0].[StackName,StackStatus,StackStatusReason]" --output text 2>/dev/null \
            || echo "Stack existiert noch nicht (Create)."

          if ! aws cloudformation deploy \
            --stack-name "${STACK_NAME}" \
            --template-file infra/cloudformation/taetigkeitsbericht-aws.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMS[@]}"; then
            {
              echo "::error::CloudFormation deploy fehlgeschlagen"
              echo "=== Stack-Status ==="
              aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
                --query "Stacks[0].[StackStatus,StackStatusReason]" --output text 2>/dev/null || echo "(kein Stack)"
              echo "=== FAILED-Events (text) ==="
              aws cloudformation describe-stack-events --stack-name "${STACK_NAME}" \
                --output text 2>/dev/null \
                | awk '/FAILED/ {print; c=2} c&&c--' \
                | head -n 60 \
                || echo "(keine FAILED-Events / kein Stack)"
              echo "=== Letzte Events (text, max 20 Zeilen) ==="
              aws cloudformation describe-stack-events --stack-name "${STACK_NAME}" \
                --output text 2>/dev/null | head -n 20 || true
            } | tee "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi

      - name: Export stack outputs
        id: outs
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "backend_instance_id=$(get BackendInstanceId)" >> "$GITHUB_OUTPUT"
          echo "frontend_instance_id=$(get FrontendInstanceId)" >> "$GITHUB_OUTPUT"
          echo "backend_public_ip=$(get BackendPublicIp)" >> "$GITHUB_OUTPUT"
          echo "frontend_public_ip=$(get FrontendPublicIp)" >> "$GITHUB_OUTPUT"
          echo "ec2_role_arn=$(get Ec2RoleArn)" >> "$GITHUB_OUTPUT"
          # DsqlEndpoint nur loggen (Job-Outputs würden von GitHub oft verworfen)
          echo "DsqlEndpoint=$(get DsqlEndpoint)"

  build-and-deploy-apps:
    name: Build & deploy Backend + Frontend auf EC2
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve DSQL endpoint from stack
        id: stack
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          DSQL_ENDPOINT="$(get DsqlEndpoint)"
          EC2_ROLE_ARN="$(get Ec2RoleArn)"
          if [ -z "$DSQL_ENDPOINT" ] || [ "$DSQL_ENDPOINT" = "None" ]; then
            echo "::error::DsqlEndpoint fehlt im Stack $STACK_NAME"
            exit 1
          fi
          # In denselben Job via ENV (nicht Job-Output), damit GitHub den Wert nicht verwirft
          {
            echo "DSQL_ENDPOINT=$DSQL_ENDPOINT"
            echo "EC2_ROLE_ARN=$EC2_ROLE_ARN"
          } >> "$GITHUB_ENV"
          echo "DsqlEndpoint aufgelöst (${#DSQL_ENDPOINT} Zeichen)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Publish Backend
        run: |
          dotnet publish Backend/src/Taetigkeitsbericht.Backend.csproj \
            -c Release \
            -o artifacts/backend

      - name: Build Frontend
        working-directory: Frontend
        env:
          BACKEND_PUBLIC: ${{ secrets.BACKEND_HOST_PUBLIC }}
          BACKEND_IP: ${{ needs.deploy-infra.outputs.backend_public_ip }}
        run: |
          if [ -n "${BACKEND_PUBLIC}" ]; then
            export VITE_GRAPHQL_URL="${BACKEND_PUBLIC%/}/graphql"
          else
            export VITE_GRAPHQL_URL="http://${BACKEND_IP}:5108/graphql"
          fi
          echo "VITE_GRAPHQL_URL=$VITE_GRAPHQL_URL"
          npm ci
          npm run build

      - name: Pack artifacts
        run: |
          mkdir -p dist
          tar -czf dist/backend.tar.gz -C artifacts/backend .
          tar -czf dist/frontend.tar.gz -C Frontend/dist .
          cp infra/scripts/ec2-dsql-bootstrap.sh dist/ec2-dsql-bootstrap.sh

      - name: Upload artifacts to S3 staging
        id: s3
        run: |
          set -euo pipefail
          BUCKET="${PROJECT_NAME}-deploy-${{ github.run_id }}-${{ github.run_attempt }}"
          # Temporärer Bucket pro Run (oder festen Deploy-Bucket in Secrets nutzen)
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            fi
          fi
          aws s3 cp dist/backend.tar.gz "s3://${BUCKET}/backend.tar.gz"
          aws s3 cp dist/frontend.tar.gz "s3://${BUCKET}/frontend.tar.gz"
          aws s3 cp dist/ec2-dsql-bootstrap.sh "s3://${BUCKET}/ec2-dsql-bootstrap.sh"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM on instances
        run: |
          set -euo pipefail
          for ID in "${{ needs.deploy-infra.outputs.backend_instance_id }}" \
                    "${{ needs.deploy-infra.outputs.frontend_instance_id }}"; do
            echo "Waiting for SSM: $ID"
            for i in $(seq 1 36); do
              STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$ID" \
                --query "InstanceInformationList[0].PingStatus" --output text || true)
              if [ "$STATUS" = "Online" ]; then
                echo "Online: $ID"
                break
              fi
              sleep 10
            done
          done

      - name: Deploy Backend + DSQL bootstrap + migrate via SSM
        env:
          INSTANCE_ID: ${{ needs.deploy-infra.outputs.backend_instance_id }}
          BUCKET: ${{ steps.s3.outputs.bucket }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DSQL_ENDPOINT:-}" ]; then
            echo "::error::DSQL_ENDPOINT ist leer"
            exit 1
          fi
          if [ -z "${EC2_ROLE_ARN:-}" ]; then
            echo "::error::EC2_ROLE_ARN ist leer"
            exit 1
          fi

          # SSM-Befehle als JSON-Datei (weniger Quoting-Probleme)
          python3 <<'PY'
          import json, os
          bucket = os.environ["BUCKET"]
          jwt = os.environ["JWT_KEY"]
          dsql = os.environ["DSQL_ENDPOINT"]
          role = os.environ["EC2_ROLE_ARN"]
          region = os.environ["AWS_REGION"]
          # systemd Environment-Werte: Anführungszeichen escapen
          def env_line(key: str, value: str) -> str:
              safe = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'Environment="{key}={safe}"\n'

          unit = (
              "[Unit]\nDescription=Taetigkeitsbericht Backend\nAfter=network.target\n"
              "[Service]\nWorkingDirectory=/opt/taetigkeitsbericht/backend\n"
              "ExecStart=/usr/local/bin/dotnet /opt/taetigkeitsbericht/backend/Taetigkeitsbericht.Backend.dll --urls=http://0.0.0.0:5108\n"
              "Restart=always\n"
              + env_line("ASPNETCORE_ENVIRONMENT", "Production")
              + env_line("Jwt__Key", jwt)
              + env_line("Database__UseDsql", "true")
              + env_line("Database__Host", dsql)
              + env_line("Database__User", "verwaltung")
              + env_line("Database__Database", "postgres")
              + env_line("Database__MigrateOnStartup", "true")
              + env_line("AWS_REGION", region)
              + env_line("AWS_DEFAULT_REGION", region)
              + "[Install]\nWantedBy=multi-user.target\n"
          )
          cmds = [
              "set -eux",
              "dnf install -y tar gzip awscli postgresql15 || yum install -y tar gzip awscli postgresql15 || true",
              "mkdir -p /opt/taetigkeitsbericht/backend /opt/taetigkeitsbericht/scripts",
              f"aws s3 cp s3://{bucket}/backend.tar.gz /tmp/backend.tar.gz",
              f"aws s3 cp s3://{bucket}/ec2-dsql-bootstrap.sh /opt/taetigkeitsbericht/scripts/ec2-dsql-bootstrap.sh",
              "chmod +x /opt/taetigkeitsbericht/scripts/ec2-dsql-bootstrap.sh",
              "tar -xzf /tmp/backend.tar.gz -C /opt/taetigkeitsbericht/backend",
              f"export DSQL_ENDPOINT={json.dumps(dsql)}",
              f"export EC2_ROLE_ARN={json.dumps(role)}",
              f"export AWS_REGION={json.dumps(region)}",
              "export AWS_DEFAULT_REGION=\"$AWS_REGION\"",
              "/opt/taetigkeitsbericht/scripts/ec2-dsql-bootstrap.sh",
              "curl -fsSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0",
              "ln -sfn \"$HOME/.dotnet/dotnet\" /usr/local/bin/dotnet || true",
              "ln -sfn /root/.dotnet/dotnet /usr/local/bin/dotnet || true",
              "cat > /etc/systemd/system/taetigkeitsbericht-backend.service <<'UNIT'\n"
              + unit
              + "UNIT\n",
              "systemctl daemon-reload",
              "systemctl enable taetigkeitsbericht-backend",
              "systemctl restart taetigkeitsbericht-backend",
              "sleep 15",
              "systemctl is-active taetigkeitsbericht-backend",
              "journalctl -u taetigkeitsbericht-backend -n 80 --no-pager || true",
          ]
          with open("/tmp/ssm-backend-commands.json", "w", encoding="utf-8") as f:
              json.dump({"commands": cmds}, f)
          print("SSM command payload written,", len(cmds), "commands")
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Backend + DSQL bootstrap" \
            --parameters file:///tmp/ssm-backend-commands.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId=$COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Backend-SSM-Deploy fehlgeschlagen: $STATUS"
            exit 1
          fi

      - name: Deploy Frontend via SSM
        env:
          INSTANCE_ID: ${{ needs.deploy-infra.outputs.frontend_instance_id }}
          BUCKET: ${{ steps.s3.outputs.bucket }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Frontend" \
            --parameters commands='[
              "set -eux",
              "dnf install -y tar gzip awscli nginx || yum install -y tar gzip awscli nginx",
              "aws s3 cp s3://'"${BUCKET}"'/frontend.tar.gz /tmp/frontend.tar.gz",
              "rm -rf /usr/share/nginx/html/*",
              "tar -xzf /tmp/frontend.tar.gz -C /usr/share/nginx/html",
              "systemctl enable nginx",
              "systemctl restart nginx"
            ]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[Status,StandardOutputContent,StandardErrorContent]" --output text

      - name: Cleanup staging bucket
        if: always()
        run: |
          BUCKET="${{ steps.s3.outputs.bucket }}"
          if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]; then
            aws s3 rb "s3://${BUCKET}" --force || true
          fi

      - name: Summary
        run: |
          echo "### Deploy fertig" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: http://${{ needs.deploy-infra.outputs.frontend_public_ip }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend:  http://${{ needs.deploy-infra.outputs.backend_public_ip }}:5108/graphql" >> "$GITHUB_STEP_SUMMARY"
          echo "- DSQL endpoint: ${DSQL_ENDPOINT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- EC2 Role (IAM GRANT verwaltung): ${EC2_ROLE_ARN:-${{ needs.deploy-infra.outputs.ec2_role_arn }}}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline: DSQL-Rolle/GRANT via \`ec2-dsql-bootstrap.sh\` (idempotent), nur ausstehende EF-Migrationen (\`MigrateAsync\`) – **keine** DB-Löschung." >> "$GITHUB_STEP_SUMMARY"
