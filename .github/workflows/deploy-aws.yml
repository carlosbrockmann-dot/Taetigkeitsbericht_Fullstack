name: Deploy AWS (main)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_instance_refresh:
        description: "EC2-Instanzen per CloudFormation ersetzen (UserData/CodeDeploy-Agent)"
        type: boolean
        default: false
      deploy_infra:
        description: "CloudFormation-Stack aktualisieren"
        type: boolean
        default: true
      deploy_apps:
        description: "Backend + Frontend per CodeDeploy ausrollen"
        type: boolean
        default: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
  STACK_NAME: taetigkeitsbericht
  PROJECT_NAME: taetigkeitsbericht

jobs:
  deploy-infra:
    name: CloudFormation
    timeout-minutes: 90
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_infra)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${AWS_REGION:-}" ]; then
            echo "::error::AWS_REGION fehlt (Repository Secret oder Variable)."
            missing=1
          fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::error::Secret AWS_ACCESS_KEY_ID fehlt."
            missing=1
          fi
          if [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Secret AWS_SECRET_ACCESS_KEY fehlt."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure stack (fehlende Ressourcen neu, DSQL nie löschen)
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_instance_refresh || 'false' }}
          KEY_NAME: ${{ secrets.EC2_KEY_NAME }}
          TEMPLATE_FILE: infra/cloudformation/taetigkeitsbericht-aws.yml
        run: |
          set -euo pipefail
          sed -i 's/\r$//' infra/scripts/ensure-cloudformation-stack.sh
          chmod +x infra/scripts/ensure-cloudformation-stack.sh
          echo "Region=${AWS_REGION} Stack=${STACK_NAME}"
          aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query "Stacks[0].[StackName,StackStatus]" --output text 2>/dev/null \
            || echo "Stack existiert noch nicht (Create)."
          bash infra/scripts/ensure-cloudformation-stack.sh

  deploy-apps:
    name: Build & CodeDeploy
    needs: [deploy-infra]
    if: >
      always() &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_apps)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${AWS_REGION:-}" ]; then echo "::error::AWS_REGION fehlt."; missing=1; fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then echo "::error::AWS_ACCESS_KEY_ID fehlt."; missing=1; fi
          if [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then echo "::error::AWS_SECRET_ACCESS_KEY fehlt."; missing=1; fi
          if [ -z "${JWT_KEY:-}" ]; then echo "::error::JWT_KEY fehlt."; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read stack outputs
        id: stack
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          BUCKET="$(get ArtifactBucketName)"
          BACKEND_IP="$(get BackendPublicIp)"
          FRONTEND_IP="$(get FrontendPublicIp)"
          CD_BE="$(get CodeDeployBackendApp)"
          CD_FE="$(get CodeDeployFrontendApp)"
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "::error::ArtifactBucketName fehlt – zuerst Infra-Job (CloudFormation) laufen lassen."
            exit 1
          fi
          {
            echo "bucket=$BUCKET"
            echo "backend_ip=$BACKEND_IP"
            echo "frontend_ip=$FRONTEND_IP"
            echo "cd_backend=$CD_BE"
            echo "cd_frontend=$CD_FE"
          } >> "$GITHUB_OUTPUT"
          echo "Bucket=$BUCKET BackendEIP=$BACKEND_IP FrontendEIP=$FRONTEND_IP"

      - name: JWT nach SSM Parameter Store
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/${PROJECT_NAME}/jwt-key" \
            --type SecureString \
            --value "$JWT_KEY" \
            --overwrite

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Publish Backend (self-contained linux-x64)
        run: |
          dotnet publish Backend/src/Taetigkeitsbericht.Backend.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -o artifacts/backend

      - name: Build Frontend
        working-directory: Frontend
        env:
          BACKEND_PUBLIC: ${{ secrets.BACKEND_HOST_PUBLIC }}
          BACKEND_IP: ${{ steps.stack.outputs.backend_ip }}
        run: |
          if [ -n "${BACKEND_PUBLIC}" ]; then
            export VITE_GRAPHQL_URL="${BACKEND_PUBLIC%/}/graphql"
          else
            export VITE_GRAPHQL_URL="http://${BACKEND_IP}:5108/graphql"
          fi
          echo "VITE_GRAPHQL_URL=$VITE_GRAPHQL_URL"
          npm ci
          npm run build

      - name: Pack CodeDeploy bundles
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          DSQL_ENDPOINT="$(get DsqlEndpoint)"
          EC2_ROLE_ARN="$(get Ec2RoleArn)"
          FRONTEND_IP="${{ steps.stack.outputs.frontend_ip }}"
          BACKEND_IP="${{ steps.stack.outputs.backend_ip }}"
          if [ -z "$DSQL_ENDPOINT" ] || [ "$DSQL_ENDPOINT" = "None" ]; then
            echo "::error::DsqlEndpoint fehlt im Stack"
            exit 1
          fi
          mkdir -p dist/backend/app dist/backend/scripts dist/backend/config \
                   dist/frontend/dist dist/frontend/scripts
          cp -a artifacts/backend/. dist/backend/app/
          chmod +x dist/backend/app/Taetigkeitsbericht.Backend || true
          cp infra/codedeploy/backend/appspec.yml dist/backend/appspec.yml
          cp infra/codedeploy/backend/scripts/*.sh dist/backend/scripts/
          cp infra/codedeploy/backend/taetigkeitsbericht-backend.service dist/backend/scripts/
          cp infra/scripts/ec2-dsql-bootstrap.sh dist/backend/scripts/ec2-dsql-bootstrap.sh
          umask 077
          {
            echo "ASPNETCORE_ENVIRONMENT=Production"
            echo "ASPNETCORE_URLS=http://0.0.0.0:5108"
            echo "Database__UseDsql=true"
            echo "Database__Host=${DSQL_ENDPOINT}"
            echo "Database__User=verwaltung"
            echo "Database__Database=postgres"
            echo "Database__MigrateOnStartup=true"
            echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=true"
            echo "AWS_REGION=${AWS_REGION}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION}"
            echo "DSQL_ENDPOINT=${DSQL_ENDPOINT}"
            echo "EC2_ROLE_ARN=${EC2_ROLE_ARN}"
            echo "Cors__Origins__0=http://${FRONTEND_IP}"
            echo "HttpsRedirection__Enabled=false"
            echo "EmailConfirmation__ConfirmationBaseUrl=http://${BACKEND_IP}:5108"
          } > dist/backend/config/backend.env
          chmod 640 dist/backend/config/backend.env
          chmod +x dist/backend/scripts/*.sh
          sed -i 's/\r$//' dist/backend/appspec.yml dist/backend/scripts/* dist/backend/config/backend.env
          (cd dist/backend && zip -qr ../../artifacts/backend-codedeploy.zip .)

          cp -a Frontend/dist/. dist/frontend/dist/
          cp infra/codedeploy/frontend/appspec.yml dist/frontend/appspec.yml
          cp infra/codedeploy/frontend/scripts/*.sh dist/frontend/scripts/
          chmod +x dist/frontend/scripts/*.sh
          sed -i 's/\r$//' dist/frontend/appspec.yml dist/frontend/scripts/*.sh
          (cd dist/frontend && zip -qr ../../artifacts/frontend-codedeploy.zip .)
          echo "Bundles gepackt (DSQL-Host ${#DSQL_ENDPOINT} Zeichen, nicht geloggt)"

      - name: Upload bundles to artifact bucket
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          set -euo pipefail
          aws s3 cp artifacts/backend-codedeploy.zip "s3://${BUCKET}/backend.zip"
          aws s3 cp artifacts/frontend-codedeploy.zip "s3://${BUCKET}/frontend.zip"
          aws s3 cp infra/scripts/ensure-codedeploy-agent.sh "s3://${BUCKET}/ensure-codedeploy-agent.sh"

      - name: Ensure CodeDeploy agent on EC2 (SSM)
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          BE="$(get BackendInstanceId)"
          FE="$(get FrontendInstanceId)"
          echo "Backend=$BE Frontend=$FE"
          aws ec2 wait instance-status-ok --instance-ids "$BE" "$FE"
          for ID in "$BE" "$FE"; do
            echo "Warte auf SSM Online: $ID"
            ONLINE=0
            for i in $(seq 1 36); do
              STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$ID" \
                --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || true)
              echo "  $i/36 PingStatus=${STATUS:-empty}"
              if [ "$STATUS" = "Online" ]; then ONLINE=1; break; fi
              sleep 10
            done
            if [ "$ONLINE" != "1" ]; then
              echo "::error::SSM nicht Online für $ID. CodeDeploy-Agent kann so nicht nachinstalliert werden."
              echo "In GitHub: Run workflow mit force_instance_refresh=true (neue EC2, UserData installiert den Agent)."
              echo "VM nicht von Hand anlegen – CloudFormation soll die Instanzen besitzen."
              exit 1
            fi
          done

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$BE" "$FE" \
            --document-name "AWS-RunShellScript" \
            --comment "Ensure CodeDeploy agent" \
            --parameters commands="[
              \"set -eux\",
              \"aws s3 cp s3://${BUCKET}/ensure-codedeploy-agent.sh /tmp/ensure-codedeploy-agent.sh\",
              \"chmod +x /tmp/ensure-codedeploy-agent.sh\",
              \"/tmp/ensure-codedeploy-agent.sh\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId=$COMMAND_ID"
          for ID in "$BE" "$FE"; do
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$ID" || true
            ST=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$ID" \
              --query "Status" --output text)
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$ID" \
              --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
            if [ "$ST" != "Success" ]; then
              echo "::error::CodeDeploy-Agent-Setup fehlgeschlagen auf $ID ($ST)"
              exit 1
            fi
          done
          echo "Agent auf beiden Instanzen aktiv – 20s Polling"
          sleep 20

      - name: Deploy Backend via CodeDeploy
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          APP: ${{ steps.stack.outputs.cd_backend }}
        run: |
          set -euo pipefail
          last=""
          DEP_ID=""
          for i in $(seq 1 15); do
            set +e
            last=$(aws deploy create-deployment \
              --application-name "$APP" \
              --deployment-group-name backend \
              --s3-location "bucket=${BUCKET},key=backend.zip,bundleType=zip" \
              --description "Backend ${GITHUB_SHA}" \
              --file-exists-behavior OVERWRITE \
              --ignore-application-stop-failures \
              --query deploymentId --output text 2>&1)
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && [[ "$last" == d-* ]]; then
              DEP_ID="$last"
              break
            fi
            echo "Versuch $i/15: $last"
            sleep 20
          done
          if [ -z "$DEP_ID" ]; then
            echo "::error::Backend CodeDeploy fehlgeschlagen: $last"
            exit 1
          fi
          echo "DeploymentId=$DEP_ID"
          if ! aws deploy wait deployment-successful --deployment-id "$DEP_ID"; then
            echo "::error::Backend CodeDeploy $DEP_ID Failed"
            echo "=== get-deployment ==="
            aws deploy get-deployment --deployment-id "$DEP_ID" --output json || true
            echo "=== instances ==="
            aws deploy list-deployment-instances --deployment-id "$DEP_ID" --output json || true
            for iid in $(aws deploy list-deployment-instances --deployment-id "$DEP_ID" --query "instancesList[]" --output text 2>/dev/null || true); do
              echo "=== instance $iid ==="
              aws deploy get-deployment-instance --deployment-id "$DEP_ID" --instance-id "$iid" --output json || true
            done
            echo "=== targets ==="
            aws deploy list-deployment-targets --deployment-id "$DEP_ID" --output json || true
            exit 1
          fi

      - name: Deploy Frontend via CodeDeploy
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          APP: ${{ steps.stack.outputs.cd_frontend }}
        run: |
          set -euo pipefail
          last=""
          DEP_ID=""
          for i in $(seq 1 15); do
            set +e
            last=$(aws deploy create-deployment \
              --application-name "$APP" \
              --deployment-group-name frontend \
              --s3-location "bucket=${BUCKET},key=frontend.zip,bundleType=zip" \
              --description "Frontend ${GITHUB_SHA}" \
              --file-exists-behavior OVERWRITE \
              --ignore-application-stop-failures \
              --query deploymentId --output text 2>&1)
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && [[ "$last" == d-* ]]; then
              DEP_ID="$last"
              break
            fi
            echo "Versuch $i/15: $last"
            sleep 20
          done
          if [ -z "$DEP_ID" ]; then
            echo "::error::Frontend CodeDeploy fehlgeschlagen: $last"
            exit 1
          fi
          echo "DeploymentId=$DEP_ID"
          if ! aws deploy wait deployment-successful --deployment-id "$DEP_ID"; then
            echo "::error::Frontend CodeDeploy $DEP_ID Failed"
            aws deploy get-deployment --deployment-id "$DEP_ID" --output json || true
            for iid in $(aws deploy list-deployment-instances --deployment-id "$DEP_ID" --query "instancesList[]" --output text 2>/dev/null || true); do
              aws deploy get-deployment-instance --deployment-id "$DEP_ID" --instance-id "$iid" --output json || true
            done
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: http://${{ steps.stack.outputs.frontend_ip }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend:  http://${{ steps.stack.outputs.backend_ip }}:5108/graphql" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact-Bucket: ${{ steps.stack.outputs.bucket }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ausroll-Kanal: CodeDeploy. Jeder Lauf legt fehlende Infra neu an; vorhandene Aurora DSQL wird nicht gelöscht (Retain + Import)." >> "$GITHUB_STEP_SUMMARY"
