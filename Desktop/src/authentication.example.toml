# Vorlage für Desktop/src/authentication.toml (echte Datei nicht committen, wenn Secrets enthalten).

[authentication]
username = "mein.benutzer"
username_password = "MeinPasswort"
username_email = "mein.benutzer@example.com"

[webapi]
# Backend HTTP-Profil:
base_url = "http://localhost:5108"
# Backend HTTPS-Profil (dotnet run --launch-profile https):
# base_url = "https://localhost:7022"
# React-Online-Ansicht (npm run dev im Ordner Frontend):
frontend_url = "http://localhost:5173"
token_expires_hours = 24
# TLS-Prüfung (Default true). Nach "dotnet dev-certs https --trust" belassen.
# Ohne vertrautes Dev-Zertifikat lokal:
# verify_ssl = false
