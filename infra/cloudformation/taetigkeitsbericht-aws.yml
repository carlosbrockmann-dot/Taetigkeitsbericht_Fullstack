AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Tätigkeitsbericht VPC, EC2 (Backend/Frontend), Aurora DSQL und PrivateLink-Endpoint.
  DB-Traffic bleibt in der VPC (Interface Endpoint Port 5432).

Parameters:
  ProjectName:
    Type: String
    Default: taetigkeitsbericht
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.small
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair name (leave empty to skip SSH key)
  ForceInstanceRefresh:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When true, bumps UserData so EC2 resources are replaced
  ProvisionCompute:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      VPC, Subnets, EC2, EIPs, Security Groups. Pipeline setzt false nur,
      um fehlende (außerhalb des Stacks gelöschte) Netz-/Compute-Ressourcen
      aus dem Stack zu nehmen und danach neu anzulegen.
  ProvisionDsql:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Aurora-DSQL-Cluster im Stack. false nur wenn der Cluster in AWS bereits
      weg ist (Unregister via DeletionPolicy Retain – kein Delete). Existierende
      Cluster werden nie gelöscht.
  ProvisionDsqlEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: PrivateLink-Endpoint. false nur zum Unregister wenn der Endpoint in AWS fehlt.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  RefreshInstances: !Equals [!Ref ForceInstanceRefresh, "true"]
  CreateCompute: !Equals [!Ref ProvisionCompute, "true"]
  CreateDsql: !Equals [!Ref ProvisionDsql, "true"]
  CreateDsqlEndpoint: !And
    - !Condition CreateCompute
    - !Condition CreateDsql
    - !Equals [!Ref ProvisionDsqlEndpoint, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-igw"

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-b"

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.12.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-b"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateCompute
    DependsOn: AttachGateway
    DeletionPolicy: Retain
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # --- Security Groups ---
  SgFrontend:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      GroupDescription: Frontend HTTP(S)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg-frontend"

  SgBackend:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      GroupDescription: Backend GraphQL HTTP(S)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5108
          ToPort: 5108
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg-backend"

  SgDsqlEndpoint:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      GroupDescription: Aurora DSQL PrivateLink endpoint (5432 from Backend)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref SgBackend
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg-dsql-vpce"

  # --- Artifact bucket (dauerhaft, CodeDeploy) ---
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-artifacts"

  # --- IAM for EC2 (SSM Debug + CodeDeploy + DSQL) ---
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforAWSCodeDeploy
      Policies:
        - PolicyName: DsqlConnect
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dsql:DbConnect
                  - dsql:DbConnectAdmin
                Resource: "*"
        - PolicyName: ArtifactAndJwt
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/jwt-key"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2Role

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole

  CodeDeployAppBackend:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-backend"
      ComputePlatform: Server

  CodeDeployAppFrontend:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-frontend"
      ComputePlatform: Server

  CodeDeployGroupBackend:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployAppBackend
      DeploymentGroupName: backend
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      Ec2TagFilters:
        - Key: Role
          Value: backend
          Type: KEY_AND_VALUE

  CodeDeployGroupFrontend:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployAppFrontend
      DeploymentGroupName: frontend
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      Ec2TagFilters:
        - Key: Role
          Value: frontend
          Type: KEY_AND_VALUE

  # --- Aurora DSQL ---
  # Bestehender Cluster wird bei Stack-Updates beibehalten; Pipeline löscht keine Daten
  # (nur idempotenter Bootstrap + EF-Migrationen). Schutz gegen versehentliches Löschen:
  DsqlCluster:
    Type: AWS::DSQL::Cluster
    Condition: CreateDsql
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtectionEnabled: true
      Tags:
        - Key: Name
          Value: taetigkeitsbericht-fullstack-dsql
        - Key: DatabaseIntent
          Value: Taetigkeitsbericht

  DsqlVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateDsqlEndpoint
    DependsOn: DsqlCluster
    DeletionPolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !GetAtt DsqlCluster.VpcEndpointServiceName
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref SgDsqlEndpoint

  # --- EC2 Backend / Frontend ---
  BackendInstance:
    Type: AWS::EC2::Instance
    Condition: CreateCompute
    DependsOn:
      - AttachGateway
    DeletionPolicy: Retain
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref Ec2InstanceProfile
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref SgBackend
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend"
        - Key: Role
          Value: backend
        - Key: RefreshBump
          Value: !If [RefreshInstances, !Sub "${AWS::StackId}-refresh", "stable"]
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -eux
              # Kein "dnf update -y": blockiert den CodeDeploy-Agent (Reboot/Timeout).
              dnf install -y ruby wget tar gzip amazon-ssm-agent \
                || yum install -y ruby wget tar gzip amazon-ssm-agent
              systemctl enable amazon-ssm-agent || true
              systemctl restart amazon-ssm-agent || true
              cd /tmp
              wget -q "https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install" -O /tmp/codedeploy-install \
                || wget -q "https://aws-codedeploy-${AWS::Region}.s3.amazonaws.com/latest/install" -O /tmp/codedeploy-install
              chmod +x /tmp/codedeploy-install
              /tmp/codedeploy-install auto
              systemctl enable codedeploy-agent
              systemctl start codedeploy-agent
              dnf install -y postgresql15 || yum install -y postgresql15 || dnf install -y postgresql || true
              mkdir -p /opt/taetigkeitsbericht/backend /opt/taetigkeitsbericht/scripts /etc/taetigkeitsbericht
              cat > /etc/taetigkeitsbericht/backend.env <<'ENVEOF'
              ASPNETCORE_ENVIRONMENT=Production
              ASPNETCORE_URLS=http://0.0.0.0:5108
              Database__UseDsql=true
              Database__Host=${DsqlEndpoint}
              Database__User=verwaltung
              Database__Database=postgres
              Database__MigrateOnStartup=true
              DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=true
              AWS_REGION=${AWS::Region}
              AWS_DEFAULT_REGION=${AWS::Region}
              DSQL_ENDPOINT=${DsqlEndpoint}
              EC2_ROLE_ARN=${Ec2RoleArn}
              Cors__Origins__0=http://${FrontendEip}
              HttpsRedirection__Enabled=false
              ENVEOF
              chmod 640 /etc/taetigkeitsbericht/backend.env
              cat > /etc/systemd/system/taetigkeitsbericht-backend.service <<'UNITEOF'
              [Unit]
              Description=Taetigkeitsbericht Backend
              After=network.target
              [Service]
              WorkingDirectory=/opt/taetigkeitsbericht/backend
              ExecStart=/opt/taetigkeitsbericht/backend/Taetigkeitsbericht.Backend
              Restart=always
              RestartSec=5
              EnvironmentFile=/etc/taetigkeitsbericht/backend.env
              EnvironmentFile=-/etc/taetigkeitsbericht/jwt.env
              [Install]
              WantedBy=multi-user.target
              UNITEOF
              systemctl daemon-reload
              # Refresh marker: ${ForceInstanceRefresh}
            - DsqlEndpoint: !If [CreateDsql, !GetAtt DsqlCluster.Endpoint, pending-dsql]
              FrontendEip: !If [CreateCompute, !Ref FrontendEip, "0.0.0.0"]
              Ec2RoleArn: !GetAtt Ec2Role.Arn
              ForceInstanceRefresh: !Ref ForceInstanceRefresh

  FrontendInstance:
    Type: AWS::EC2::Instance
    Condition: CreateCompute
    DependsOn: AttachGateway
    DeletionPolicy: Retain
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref Ec2InstanceProfile
      SubnetId: !Ref PublicSubnetB
      SecurityGroupIds:
        - !Ref SgFrontend
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-frontend"
        - Key: Role
          Value: frontend
        - Key: RefreshBump
          Value: !If [RefreshInstances, !Sub "${AWS::StackId}-refresh", "stable"]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          dnf install -y nginx ruby wget tar gzip amazon-ssm-agent \
            || yum install -y nginx ruby wget tar gzip amazon-ssm-agent
          systemctl enable amazon-ssm-agent || true
          systemctl restart amazon-ssm-agent || true
          cd /tmp
          wget -q "https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install" -O /tmp/codedeploy-install \
            || wget -q "https://aws-codedeploy-${AWS::Region}.s3.amazonaws.com/latest/install" -O /tmp/codedeploy-install
          chmod +x /tmp/codedeploy-install
          /tmp/codedeploy-install auto
          systemctl enable codedeploy-agent
          systemctl start codedeploy-agent
          mkdir -p /usr/share/nginx/html
          systemctl enable nginx
          systemctl start nginx
          # Refresh marker: ${ForceInstanceRefresh}

  # Stabile öffentliche IPs (GetAtt Instance.PublicIp schlägt fehl, wenn keine Public IP existiert)
  BackendEip:
    Type: AWS::EC2::EIP
    Condition: CreateCompute
    DependsOn: AttachGateway
    DeletionPolicy: Retain
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend-eip"

  BackendEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      AllocationId: !GetAtt BackendEip.AllocationId
      InstanceId: !Ref BackendInstance

  FrontendEip:
    Type: AWS::EC2::EIP
    Condition: CreateCompute
    DependsOn: AttachGateway
    DeletionPolicy: Retain
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-frontend-eip"

  FrontendEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: CreateCompute
    DeletionPolicy: Retain
    Properties:
      AllocationId: !GetAtt FrontendEip.AllocationId
      InstanceId: !Ref FrontendInstance

Outputs:
  VpcId:
    Condition: CreateCompute
    Value: !Ref Vpc
  BackendInstanceId:
    Condition: CreateCompute
    Value: !Ref BackendInstance
  FrontendInstanceId:
    Condition: CreateCompute
    Value: !Ref FrontendInstance
  BackendPublicIp:
    Condition: CreateCompute
    Description: Elastic IP of backend EC2
    Value: !Ref BackendEip
  FrontendPublicIp:
    Condition: CreateCompute
    Description: Elastic IP of frontend EC2
    Value: !Ref FrontendEip
  DsqlClusterArn:
    Condition: CreateDsql
    Value: !Ref DsqlCluster
  DsqlEndpoint:
    Condition: CreateDsql
    Description: Cluster endpoint hostname (connect via PrivateLink private DNS in VPC)
    Value: !GetAtt DsqlCluster.Endpoint
  DsqlVpcEndpointServiceName:
    Condition: CreateDsql
    Value: !GetAtt DsqlCluster.VpcEndpointServiceName
  Ec2RoleArn:
    Description: Link DB role verwaltung to this IAM role via AWS IAM GRANT
    Value: !GetAtt Ec2Role.Arn
  ArtifactBucketName:
    Description: Dauerhafter S3-Bucket für CodeDeploy-Zips
    Value: !Ref ArtifactBucket
  CodeDeployBackendApp:
    Value: !Ref CodeDeployAppBackend
  CodeDeployFrontendApp:
    Value: !Ref CodeDeployAppFrontend
